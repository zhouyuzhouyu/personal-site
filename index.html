<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>星尘沙盒 · Stardust Sandbox</title>
  <meta name="description" content="一个可久久把玩的重力粒子小宇宙" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud">
    <header>
      <div>
        <h1>星尘沙盒</h1>
        <p class="sub">拖拽 · 长按画轨 · 滚轮缩放引力场</p>
      </div>
      <button id="helpBtn" type="button" aria-label="玩法">?</button>
    </header>

    <div class="panel">
      <label>引力 <span id="gVal"></span>
        <input id="gravity" type="range" min="0" max="100" value="42" />
      </label>
      <label>粘性 <span id="dVal"></span>
        <input id="drag" type="range" min="0" max="100" value="18" />
      </label>
      <label>色彩漂移 <span id="hVal"></span>
        <input id="hue" type="range" min="0" max="100" value="55" />
      </label>
      <label>粒子寿命 <span id="lVal"></span>
        <input id="life" type="range" min="20" max="100" value="70" />
      </label>
      <div class="row">
        <button id="burst" type="button">爆发</button>
        <button id="clear" type="button" class="ghost">清空</button>
        <button id="mode" type="button" class="ghost">模式：引力井</button>
      </div>
      <p class="hint" id="hint">左键拖拽移动 · 右键 / 双指按住喷粒子 · 空格爆发</p>
    </div>
  </div>

  <div id="help" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2>怎么玩</h2>
      <ul>
        <li><b>拖拽</b>：移动引力井 / 排斥源</li>
        <li><b>长按或右键</b>：沿路径喷出星尘</li>
        <li><b>爆发</b>：从中心炸开一圈粒子</li>
        <li><b>模式</b>：引力井 ↔ 排斥源 ↔ 漩涡</li>
        <li>调旋钮，看粒子如何长出自己的形状</li>
      </ul>
      <button id="closeHelp" type="button">开始把玩</button>
    </div>
  </div>

  <script src="sandbox.js"></script>
</body>
</html>
